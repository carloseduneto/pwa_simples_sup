<main class="page-stimulus">
  <!-- Navegação de Período -->
  <section class="period-navigation">
    <div class="tabs-container" id="periodTabs">
      <button class="tab-btn active" data-period="day">Dia</button>
      <button class="tab-btn" data-period="week">Sem.</button>
      <button class="tab-btn" data-period="month">Mês</button>
      <button class="tab-btn" data-period="year">Ano</button>
    </div>

    <div class="date-selector">
      <button class="btn-nav-date" id="btnPrevDate">
        <span class="material-symbols-rounded"> chevron_left </span>
      </button>
      <span id="currentDateDisplay"></span>
      <button class="btn-nav-date" id="btnNextDate">
        <span class="material-symbols-rounded"> chevron_right </span>
      </button>
    </div>
  </section>

  <!-- Resumo -->
  <section class="summary-info" id="summaryContainer">
    <!-- Renderizado via JS -->
  </section>

  <!-- Gráfico Radar -->
  <section class="chart-container">
    <div class="skeleton-chart"></div>
    <canvas id="stimulusRadarChart"></canvas>
  </section>

  <!-- Tabela de Volume -->
  <section class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>Músculo</th>
          <th>Séries</th>
        </tr>
      </thead>
      <tbody id="muscleTableBody">
        <!-- Renderizado via JS -->
      </tbody>
    </table>
  </section>

  <!-- Lista de Exercícios Detalhada -->
  <section class="exercise-breakdown">
    <div class="breakdown-header">
      <h2>Músculos × Exercícios</h2>
      <!-- Adicionado ID para bind JS -->
      <button class="btn-icon" id="btnToggleBreakdown">
        <span class="material-symbols-rounded"> swap_horiz </span>
      </button>
    </div>
    <div id="exerciseListContainer" class="exercise-list">
      <!-- Renderizado via JS -->
    </div>
  </section>
</main>
