<div id="itens-template-container" class="exercises-list-wrapper"></div>

<div class="_100percwidth">
  <button
    type="button"
    class="primary-button primary-button--add-center"
    onclick="adicionarItemTemplate()"
  >
    <span class="material-symbols-rounded">add</span>Adicionar exercício
  </button>
</div>

<button
  id="btn-start-internal"
  type="button"
  class="primary-button primary-button--start"
  onclick="iniciarTreino()"
>
  <span class="material-symbols-rounded icon-fill">play_arrow</span>
</button>

<template class="template-template-list-item">
  <div class="exercise-item">
    <div class="exercise-item__info">
      <strong class="exercise-item__name">Nome exercício</strong>
      <span class="exercise-item__group">Grupo muscular • 4x12</span>
    </div>

    <div class="exercise-item__actions">
      <button
        class="exercise-item__btn exercise-item__btn--edit"
        aria-label="Editar"
      >
        <span class="material-symbols-rounded">edit</span>
      </button>

      <button
        class="exercise-item__btn exercise-item__btn--delete"
        aria-label="Excluir"
      >
        <span class="material-symbols-rounded">delete</span>
      </button>
      <button
        class="exercise-item__btn exercise-item__btn--drag"
        aria-label="Excluir"
      >
        <span class="material-symbols-rounded">drag_handle</span>
      </button>
    </div>
  </div>
</template>
