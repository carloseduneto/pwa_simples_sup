<!-- App Shell HTML -->

<header class="template-header--actions">
  <div id="container-recomendacoes"></div>
  <button id="template-button-inactived" class="btn-template-inactive-active">
    <span class="material-symbols-rounded">block</span>
    <span class="btn-text-header">Inativos</span>
  </button>
</header>

<button class="rounded-button" data-route="bodyAssessmentList">
  <span class="material-symbols-rounded rounded-button--area">straighten</span>
  <span class="rounded-button--subtitle">Avaliações</span>
</button>

<div class="input-grouped-form">
  <span class="input-grouped-form--titulo">Nome grupo</span>
  <div class="input-grouped-form">
    <label for="input-large">Parâmetro 1</label>
    <input
      type="text"
      id="input-large"
      placeholder="xxxxx"
      required
      class="default-form-input"
    />
  </div>
</div>

<div class="input-grouped-form">
  <div class="input-grouped-form--retractable-area">

    <span class="input-grouped-form--titulo dont-select">Nome grupo retrátil</span>
    <span class="material-symbols-rounded input-grouped-form--retractable-icon dont-select">arrow_back_ios_new</span>
  </div>
  <div class="input-grouped-form--input-short">
    <label for="input-short">Parâmetro 1</label>
    <input
      type="text"
      id="input-short"
      placeholder="xxxxx"
      required
      class="input-short"
    />
  </div>
</div>

<div id="lista-templates"></div>
<button
  type="button"
  class="primary-button primary-button--add"
  data-route="templateForm"
>
  <span class="material-symbols-rounded">add_2</span>
</button>
