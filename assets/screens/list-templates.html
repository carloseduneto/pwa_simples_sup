<header class="template-header--actions">

  <button id="template-button-inactived" class="btn-template-inactive-active">
    <span class="material-symbols-rounded">block</span>
    <span class="btn-text-header">Inativos</span>
  </button>
</header>

<div class="flex-row">
  <button class="rounded-button" data-route="bodyAssessmentList">
    <span class="material-symbols-rounded rounded-button--area"
      >straighten</span
    >
    <span class="rounded-button--subtitle">Avaliações</span>
  </button>

  <button class="rounded-button" data-route="bodyAssessmentCompare">
    <span class="material-symbols-rounded rounded-button--area"
      >compare_arrows</span
    >
    <span class="rounded-button--subtitle">Comparar</span>
  </button>
</div>

<div id="lista-templates"></div>
<button
  type="button"
  class="primary-button primary-button--add"
  data-route="templateForm"
>
  <span class="material-symbols-rounded">add_2</span>
</button>
