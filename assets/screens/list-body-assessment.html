<div id="body-assessment-container" class="warper-screen"></div>

<button
  id="btn-create-body-assessment"
  type="button"
  class="primary-button primary-button--add"
  onclick="irParaCriacao()"
>
  <span class="material-symbols-rounded">add_2</span>
</button>


<template class="template-body-assessment-item">
    <div class="list-item">
  <div class="list-item__info">
    <div class="flex-row-space-between">
      <strong class="list-item__title">Título</strong>
    </div>
    <span class="list-item__subtitle">Subtítulo</span>
  </div>

  <div class="list-item__actions">
    <button class="list-item__btn list-item__btn--edit" aria-label="Editar">
      <span class="material-symbols-rounded">edit</span>
    </button>

    <button class="list-item__btn list-item__btn--delete" aria-label="Excluir">
      <span class="material-symbols-rounded">delete</span>
    </button>
  </div>
</div>
</template>
