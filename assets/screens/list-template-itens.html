<div id="itens-template-container" class="exercises-list-wrapper"></div>

<div class="_100percwidth buttonBaseAdd">
  <button id="btn-add-item-template" type="button" class="primary-button primary-button--add-center">
    <span class="material-symbols-rounded">add</span>Adicionar exercício
  </button>

  <button id="btn-cancel-reorder" type="button" class="default-form-button default-form-button--cancel hidden">
    Cancelar
  </button>
</div>

<!-- Novo bloco do gráfico -->
<div class="chart-container" style="position: relative; height: 340px; width: 100%; margin-top: 32px; margin-bottom: 80px; text-align: center;">
  <h3 style="font-size: 16px; margin-top: 50px; color: #333;">Distribuição muscular por séries</h3>
  <canvas id="radar-chart-musculos"></canvas>
</div>

<button id="btn-start-internal" type="button" class="primary-button primary-button--start">
  <span class="material-symbols-rounded icon-fill">play_arrow</span>
</button>

<template id="template-template-list-item">
  <div class="exercise-item">
    <div class="exercise-item__info">
      <strong class="exercise-item__name">Nome exercício</strong>
      <span class="exercise-item__group">Grupo muscular • 4x12</span>
    </div>

    <div class="exercise-item__actions">
      <button class="exercise-item__btn exercise-item__btn--edit" aria-label="Editar">
        <span class="material-symbols-rounded">edit</span>
      </button>

      <button class="exercise-item__btn exercise-item__btn--delete" aria-label="Excluir">
        <span class="material-symbols-rounded">delete</span>
      </button>
      
      <button class="exercise-item__btn exercise-item__btn--drag drag-handle hidden" aria-label="Reordenar">
        <span class="material-symbols-rounded">drag_handle</span>
      </button>
    </div>
  </div>
</template>
