<form id="form-template-itens" class="default-form exercise-form">
  
  <div class="input-group">
    <label class="form-label">Filtrar por Grupo</label>
    <select id="select-muscle-group" class="default-form-select">
      <option value="" disabled selected>Carregando grupos...</option>
    </select>
  </div>
  
  <!-- <div class="input-group">
    <label class="form-label">Exercício*</label>
    <select id="select-exercise" class="default-form-select" required disabled>
      <option value="" selected>Selecione um grupo primeiro</option>
    </select>
  </div> -->

  <div class="input-group" style="position: relative;"> <label class="form-label">Exercício*</label>
  
  <input type="text" 
         id="input-exercise-search" 
         class="default-form-input block_input" 
         placeholder="Selecione um grupo muscular" 
         autocomplete="off" 
         disabled>
  
  <input type="hidden" id="input-exercise-id">

  <ul id="list-exercise-results" class="autocomplete-list hidden"></ul>
</div>

  
  <div class="input-group switch-container" style="margin: 20px 0; display:flex; justify-content:space-between; align-items:center">
    <span>Exercício Dinâmico?</span>
    <label class="switch">
      <input type="checkbox" id="switch-dynamic">
      <span class="slider round"></span>
    </label>
  </div>

  <div id="container-static">
    <div class="form-exercise-series">
      <div class="input-group">
        <input type="number" id="input-series" placeholder="Séries" class="default-form-input" />
      </div>
      <span class="form-exercise--series-reps">×</span>
      <div class="input-group">
        <input type="text" id="input-reps" placeholder="Reps (Ex: 8-12)" class="default-form-input" />
      </div>
    </div>
  </div>

  <div id="container-dynamic" class="hidden">
    <div class="input-group">
      <select id="select-recommendation" class="default-form-select">
        <option value="" selected>Tipo (Ex: Top Set, Feeder)</option>
      </select>
    </div>
  </div>

  <div class="input-group">
    <input type="text" id="input-technique" placeholder="Téc. Intensificação (Opcional)" class="default-form-input" />
  </div>

  <div class="form-actions">
      <button type="submit" class="default-form-button default-form-button--save">
        Salvar Item
      </button>
      <button type="button" class="default-form-button default-form-button--cancel" onclick="voltarParaItens()">
        Cancelar
      </button>
  </div>
</form>
