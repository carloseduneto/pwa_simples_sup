<!doctype html>
<html lang="pt-BR" data-theme-gray="color-dove-gray-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supabase Edge PWA</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#ff6314" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/main.css" />

    <link
      rel="shortcut icon"
      href="assets/images/logo.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div id="initial-loader" class="espaco-loader">
      <div class="loader"></div>
    </div>

    <div id="auth-section"></div>

    <div id="app-section" class="hidden">
      <div class="headerPage" id="app-header">
        <div>
          <h2 id="header-title"></h2>
        </div>
        <div class="userPlace" id="userContainer">
          <div class="userImage" id="btnUser"></div>

          <div class="userData" id="menuData">
            <span class="btn-fechar" id="btnClose">&times;</span>
            <div class="userDataContent">
              <!-- FIX: Pegar/Verificar o qual o e-mail que o usuário logou -->
              <p>Logado como: <span id="user-email">usuario@email.com</span></p>
              <!-- <button data-route="exercises" class="nav-item"></button> -->
              <button data-route="exercises">
                <span class="material-symbols-rounded">accessible_menu</span>
                Exercícios
              </button>
              <button data-route="workoutHistory">
                <span class="material-symbols-rounded">history</span>
                Histórico
              </button>
              <button data-route="config">
                <span class="material-symbols-rounded"> settings </span>
                Configurações
              </button>
              <button onclick="signOut()" class="signOut" id="btn-logout">
                <span class="material-symbols-rounded rotate180"> logout </span>
                Sair
              </button>
            </div>
          </div>
        </div>
      </div>

      <div id="app-header-alt" class="headerPageAlternative hidden">
        <div class="header-alternative-1">
          <button onclick="history.back()" class="navigation-buttons">
            <span class="material-symbols-rounded"> arrow_back_ios_new </span>
          </button>
          <h2 id="header-title-alt">Título Alternativo</h2>
        </div>
      </div>

      <div id="app-header-drag" class="headerPageAlternative hidden">
        <div class="header-alternative-1">
          <button onclick="history.back()" class="navigation-buttons">
            <span class="material-symbols-rounded"> arrow_back_ios_new </span>
          </button>
          <h2 id="header-title-drag-handle">Título Alternativo</h2>

          <div class="header-side-right">
            <button
              id="template-itens-reorder"
              onclick="alternarVisualizacaoInativos()"
              class="btn-template-inactive-active"
            >
              <span class="material-symbols-rounded rotate180"
                >low_priority</span
              >
              <span class="btn-text-header">Reordenar</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Screens section -->
      <div id="screen-templates-list"></div>
      <div id="bottom-nav-container"></div>
      <div id="screen-template-add-edit" class="hidden"></div>
      <div id="screen-template-itens" class="hidden"></div>
      <div id="screen-template-itens-form" class="hidden"></div>
      <div id="screen-workout-details" class="hidden"></div>
      <div id="screen-config" class="hidden"></div>
      <div id="screen-exercises" class="hidden"></div>
      <div id="screen-exercises-add-edit" class="hidden"></div>
      <div id="screen-workout-history" class="hidden"></div>

      <!-- Body assessment -->
       <div id="screen-body-assessment" class="hidden"></div>
       <div id="screen-body-assessment-form" class="hidden"></div>

    </div>

    <div class="templates-backdrop"></div>

    <aside class="templates-options-container">
      <div class="tmp-opt-dragger-place">
        <span class="tmp-opt-dragger"></span>
      </div>
      <span></span>
      <div class="tmp-opt-item" id="start-session">
        <span class="material-symbols-rounded temp-opt-icon--fill">
          play_arrow
        </span>
        <span>Iniciar treino</span>
      </div>
      <div class="tmp-opt-item" id="template-itens">
        <span class="material-symbols-rounded"> category_search </span>
        <span>Ver treino</span>
      </div>
      <div class="tmp-opt-item" data-route="templateForm">
        <span class="material-symbols-rounded"> edit </span>
        <span>Editar</span>
      </div>
      <div class="tmp-opt-item tmp-opt-item--deactive">
        <span class="material-symbols-rounded"> block </span>
        <span>Inativos</span>
      </div>
      <div class="tmp-opt-item tmp-opt-item--delete">
        <span class="material-symbols-rounded"> delete </span>
        <span>Excluir</span>
      </div>
    </aside>

    <script type="module" src="assets/js-es6/main.js"></script>
  </body>
</html>
